name: Merged TWA Build & Release
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Android TWA Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Calculate version
        id: version
        run: |
          BUILD_NUMBER=$(git rev-list --count HEAD)
          MAJOR=$(grep 'versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          MINOR=$(grep 'versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          # Find the commit where versionMinor was last changed
          MINOR_COMMIT=$(git blame -L '/versionMinor=/',+1 version.properties | awk '{print $1}' | tr -d '^')
          if [ -n "$MINOR_COMMIT" ]; then
            PATCH=$(git rev-list --count $MINOR_COMMIT..HEAD)
          else
            PATCH=$(grep 'versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          fi
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}.${BUILD_NUMBER}"
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> $GITHUB_ENV
          echo "MAJOR=${MAJOR}" >> $GITHUB_ENV
          echo "MINOR=${MINOR}" >> $GITHUB_ENV
          echo "Calculated Version: ${VERSION_NAME}"

      - name: Update manifest versions
        run: |
          # Update TWA manifest, package.json and app.json with the calculated version
          jq ".appVersionName = \"${VERSION_NAME}\" | .appVersionCode = ${BUILD_NUMBER}" twa-manifest.json > temp.json && mv temp.json twa-manifest.json
          jq ".version = \"${VERSION_NAME}\"" package.json > temp.json && mv temp.json package.json
          if [ -f "app.json" ]; then
            jq ".expo.version = \"${VERSION_NAME}\" | .expo.android.versionCode = ${BUILD_NUMBER} | .expo.ios.buildNumber = \"${BUILD_NUMBER}\"" app.json > temp.json && mv temp.json app.json
          fi

      - name: Export PWA
        run: |
          npx expo export --platform web
          # Ensure the icon is at the root of the dist folder to match the manifest URL
          cp assets/icon.png dist/icon.png

      - name: Generate Keystore
        id: keystore
        run: |
          if [ ! -f "keystore.p12" ]; then
            echo "Generating default keystore..."
            keytool -genkey -v -keystore keystore.p12 -storetype PKCS12 -storepass android -alias android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "KEY_ALIAS=android" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Initialize Bubblewrap config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_SDK_ROOT\"}" > ~/.bubblewrap/config.json

      - name: Build TWA
        id: build-twa
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set +e
          # Serve the dist folder locally
          mkdir -p .server/strangerdanger
          cp -r dist/* .server/strangerdanger/

          # Ensure manifest.json is at the expected path
          MANIFEST_PATH=$(find dist -name "*.json" -not -name "twa-manifest.json" | head -n 1)
          if [ -n "$MANIFEST_PATH" ]; then
            cp "$MANIFEST_PATH" .server/strangerdanger/manifest.json
          else
            cp twa-manifest.json .server/strangerdanger/manifest.json
          fi

          (cd .server && python3 -m http.server 8080 &)

          # Temporarily point manifest to the local server
          sed -i 's|https://hereliesaz.github.io|http://localhost:8080|g' twa-manifest.json

          K_PASS="${KEYSTORE_PASSWORD:-$KEYSTORE_PASSWORD}"
          [ -z "$K_PASS" ] && K_PASS="android"
          K_ALIAS="${KEY_ALIAS:-$K_ALIAS}"
          [ -z "$K_ALIAS" ] && K_ALIAS="android"

          # 1. Answer 'y' to the regeneration prompt, but skip version prompts with flags
          echo "Syncing TWA project..."
          echo "y" | bubblewrap update --yes --skipVersionUpgrade

          # 2. Build the TWA. Since we just updated, it should be silent.
          # If it STILL prompts, printf "y\n\n" handles it safely.
          echo "Building TWA..."
          printf "y\n\n" | bubblewrap build --yes \
            --signingKeyPath=keystore.p12 \
            --signingKeyAlias="$K_ALIAS" \
            --signingKeyPassword="${BUBBLEWRAP_KEY_PASSWORD:-$K_PASS}" \
            --signingKeyStorePassword="${BUBBLEWRAP_KEYSTORE_PASSWORD:-$K_PASS}" > build.log 2>&1

          EXIT_CODE=$?

          # Revert manifest changes
          sed -i 's|http://localhost:8080|https://hereliesaz.github.io|g' twa-manifest.json

          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          cat build.log
          exit $EXIT_CODE

      - name: Handle Failure
        if: failure() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG_TAIL=$(tail -c 4000 build.log | sed 's/`/\`/g')
          BODY="Build failed on branch \`${GITHUB_REF#refs/heads/}\`. ### Build Log (last 4000 chars): \`\`\` ${LOG_TAIL} \`\`\`"
          gh issue create --title "Build Failure: ${GITHUB_SHA::7}" --body "$BODY" --label "bug" --assignee "HereLiesAz"

      - name: Create Release
        if: success() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="latest-release-v${MAJOR}.${MINOR}"
          APK_NAME="strangerdanger-${VERSION_NAME}-release.apk"
          if [ -f "app-release-signed.apk" ]; then
            mv app-release-signed.apk "$APK_NAME"
          elif [ -f "app-release-unsigned.apk" ]; then
            mv app-release-unsigned.apk "$APK_NAME"
          else
            find . -name "*.apk" -exec mv {} "$APK_NAME" \; -quit
          fi

          if [ -f "$APK_NAME" ]; then
            gh release create "$TAG_NAME" "$APK_NAME" \
              --title "v${MAJOR}.${MINOR} Build ${BUILD_NUMBER}" \
              --notes "Automated TWA build for version ${VERSION_NAME}" \
              --target main || \
            gh release upload "$TAG_NAME" "$APK_NAME" --clobber
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-android-${{ env.VERSION_NAME }}
          path: strangerdanger-*-release.apk
